openai:
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://openrouter.ai/api/v1"

  llm:
    model: "moonshotai/kimi-k2.6:free"
    thinking: "medium"
    temperature: 1
    max_retries: 5

  image:
    model: "openrouter/free"
    quality: "medium"
    size:
      sheet: "2880x1920"
      poses: "2048x2048"
      panel: "1632x3808"
    max_retries: 5

pipeline:
  output_dir: "./comix-output"
  chapter_pattern: "chapter_*.md"
  cover_filename: "cover.md"
  max_concurrent_sheets: 3
  max_concurrent_poses: 2

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 15s
  auth_token: "${COMIX_AUTH_TOKEN}"
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"

logging:
  level: "info"
  format: "text"
